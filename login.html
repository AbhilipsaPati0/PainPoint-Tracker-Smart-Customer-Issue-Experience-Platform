<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — PainPoint Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300c9a7'/><text y='24' x='5' font-size='22'>📍</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('ppt-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
  </script>
</head>
<body>

<div class="auth-bg-orb"></div>
<div class="auth-bg-orb-2"></div>

<!-- ── NAVBAR (minimal) ── -->
<nav class="navbar-custom">
  <div class="container">
    <a href="index.html" class="navbar-brand-custom">
      <div class="brand-icon">📍</div>
      Pain<span class="brand-accent">Point</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
    <button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
    <a href="register.html" class="btn-ghost" style="font-size:0.85rem;">New here? Register →</a>
    </div>
  </div>
</nav>

<!-- ── AUTH WRAPPER ── -->
<div class="auth-wrapper">
  <div class="auth-card fade-in-up">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">📍</div>
      <span class="auth-logo-name">PainPoint Tracker</span>
    </div>

    <!-- Heading -->
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Log in to track and report customer issues.</p>

    <!-- Alert container (Firebase will populate this) -->
    <div id="loginAlert" class="d-none" role="alert" style="background:var(--rose-dim);border:1px solid var(--rose);border-radius:var(--radius-sm);padding:12px 16px;font-size:0.88rem;color:var(--rose);margin-bottom:20px;display:flex;align-items:center;gap:8px;">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="loginAlertMsg">Invalid email or password.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="loginEmail">Email Address</label>
        <input
          type="email"
          id="loginEmail"
          name="email"
          class="form-control-custom"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
        <div class="form-hint" id="emailHint"></div>
      </div>

      <!-- Password -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="loginPassword">Password</label>
        <div class="password-toggle" style="position:relative;">
          <input
            type="password"
            id="loginPassword"
            name="password"
            class="form-control-custom"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
            style="padding-right:42px;"
          />
          <span class="toggle-icon" id="toggleLoginPwd" title="Show/hide password">
            <i class="bi bi-eye"></i>
          </span>
        </div>
        <div class="d-flex justify-content-end mt-2">
          <a href="#" id="forgotPasswordLink" style="font-size:0.82rem;color:var(--text-muted);">Forgot password?</a>
        </div>
      </div>

      <!-- Remember Me -->
      <div class="d-flex align-items-center gap-2 mb-4">
        <input
          type="checkbox"
          id="rememberMe"
          name="rememberMe"
          style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;"
        />
        <label for="rememberMe" style="font-size:0.85rem;color:var(--text-secondary);cursor:pointer;margin:0;">
          Remember me for 30 days
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="loginBtn" class="btn-teal w-100" style="padding:13px;font-size:0.95rem;">
        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-2"></i>Log In</span>
        <span id="loginBtnLoading" class="d-none">
          <span class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span>Logging in...
        </span>
      </button>

    </form>

    <!-- Divider -->
    <div class="auth-divider">or continue with</div>

    <!-- Google Sign In -->
    <button id="googleSignInBtn" class="btn-ghost w-100" style="padding:12px;justify-content:center;display:flex;align-items:center;gap:10px;font-size:0.9rem;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.61z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Sign in with Google
    </button>

    <!-- Footer -->
    <p class="auth-footer-text">
      Don't have an account? <a href="register.html">Create one free →</a>
    </p>



  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  // Password visibility toggle
  $('#toggleLoginPwd').on('click', function() {
    const input = $('#loginPassword');
    const icon  = $(this).find('i');
    if (input.attr('type') === 'password') {
      input.attr('type', 'text');
      icon.removeClass('bi-eye').addClass('bi-eye-slash');
    } else {
      input.attr('type', 'password');
      icon.removeClass('bi-eye-slash').addClass('bi-eye');
    }
  });

  // Forgot password click handler (Firebase will implement)
  $('#forgotPasswordLink').on('click', function(e) {
    e.preventDefault();
    // Firebase: sendPasswordResetEmail()
    alert('Password reset link will be sent to your email. (Firebase implementation pending)');
  });

  // Google Sign In (Firebase will implement)
  $('#googleSignInBtn').on('click', function() {
    // Firebase: signInWithPopup(auth, googleProvider)
    console.log('[Auth] Google sign-in triggered');
  });

  // Form submit placeholder — Firebase will handle actual auth
  $('#loginForm').on('submit', function(e) {
    e.preventDefault();
    const email    = $('#loginEmail').val().trim();
    const password = $('#loginPassword').val();
    if (!email || !password) return;

    // Show loading state
    $('#loginBtnText').addClass('d-none');
    $('#loginBtnLoading').removeClass('d-none');
    $('#loginBtn').prop('disabled', true);

    // Firebase auth.js will call: signInWithEmailAndPassword(auth, email, password)
    console.log('[Auth] Login attempted for:', email);
  });
</script>


<!-- Floating theme toggle (always visible) -->
<script>
(function() {
  var t = localStorage.getItem('ppt-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
document.addEventListener('DOMContentLoaded', function() {
  function syncAllToggles(theme) {
    document.querySelectorAll('.theme-toggle').forEach(function(btn) {
      var i = btn.querySelector('i');
      if (i) i.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
      btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    });
  }
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  syncAllToggles(current);
  document.querySelectorAll('.theme-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var now  = document.documentElement.getAttribute('data-theme');
      var next = now === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('ppt-theme', next);
      syncAllToggles(next);
    });
  });
});
</script>
  <!-- ── THEME TOGGLE FAB ── -->
  <button class="theme-toggle-fab" id="themeFab" aria-label="Toggle theme">
    <i class="bi bi-moon-stars-fill"></i>
  </button>
  <script>
    /* ── Theme toggle (runs on every page) ── */
    (function () {
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('ppt-theme', theme);
        document.querySelectorAll('.theme-toggle, .theme-toggle-fab').forEach(function (btn) {
          var i = btn.querySelector('i');
          if (i) {
            i.className = theme === 'dark'
              ? 'bi bi-sun-fill'
              : 'bi bi-moon-stars-fill';
          }
          btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        });
      }

      /* Sync icon on load */
      var saved = localStorage.getItem('ppt-theme') || 'dark';
      document.addEventListener('DOMContentLoaded', function () {
        applyTheme(saved);

        /* Bind every toggle button on this page */
        document.querySelectorAll('.theme-toggle, .theme-toggle-fab').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(current === 'dark' ? 'light' : 'dark');
          });
        });
      });
    })();
  </script>
</body>
</html>
