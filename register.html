<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — PainPoint Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300c9a7'/><text y='24' x='5' font-size='22'>📍</text></svg>"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <script>
    (function(){
      try {
        var t = localStorage.getItem('ppt-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e){}
    })();
  </script>
</head>
<body>

<div class="auth-bg-orb" style="background:radial-gradient(circle,rgba(99,102,241,0.14),transparent 70%);"></div>
<div class="auth-bg-orb-2"></div>

<!-- ── NAVBAR ── -->
<nav class="navbar-custom">
  <div class="container">
    <a href="index.html" class="navbar-brand-custom">
      <div class="brand-icon">📍</div>
      Pain<span class="brand-accent">Point</span>
    </a>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
      <a href="login.html" class="btn-ghost" style="font-size:0.85rem;">Already have an account? Log in →</a>
    </div>
  </div>
</nav>

<!-- ── AUTH WRAPPER ── -->
<div class="auth-wrapper" style="padding:40px 20px;">
  <div class="auth-card fade-in-up" style="max-width:520px;">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">📍</div>
      <span class="auth-logo-name">PainPoint Tracker</span>
    </div>

    <!-- Heading -->
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Join the platform and start reporting customer pain points.</p>

    <!-- Error Alert -->
    <div id="registerAlert" class="d-none" role="alert" style="background:var(--rose-dim);border:1px solid var(--rose);border-radius:var(--radius-sm);padding:12px 16px;font-size:0.88rem;color:var(--rose);margin-bottom:20px;display:flex;align-items:center;gap:8px;">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="registerAlertMsg">Something went wrong. Please try again.</span>
    </div>

    <!-- Success Alert -->
    <div id="registerSuccess" class="d-none" style="background:var(--teal-dim);border:1px solid var(--teal-mid);border-radius:var(--radius-sm);padding:12px 16px;font-size:0.88rem;color:var(--teal);margin-bottom:20px;display:flex;align-items:center;gap:8px;">
      <i class="bi bi-check-circle-fill"></i>
      <span>Account created! Redirecting to explore...</span>
    </div>

    <!-- Register Form -->
    <form id="registerForm" novalidate>

      <!-- Full Name -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="registerName">Full Name</label>
        <input
          type="text"
          id="registerName"
          name="fullName"
          class="form-control-custom"
          placeholder="Jane Doe"
          required
          autocomplete="name"
        />
      </div>

      <!-- Email -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="registerEmail">Email Address</label>
        <input
          type="email"
          id="registerEmail"
          name="email"
          class="form-control-custom"
          placeholder="jane@example.com"
          required
          autocomplete="email"
        />
      </div>

      <!-- Password -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="registerPassword">Password</label>
        <div style="position:relative;">
          <input
            type="password"
            id="registerPassword"
            name="password"
            class="form-control-custom"
            placeholder="Create a strong password"
            required
            autocomplete="new-password"
            style="padding-right:42px;"
          />
          <span id="toggleRegPwd" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;font-size:15px;">
            <i class="bi bi-eye"></i>
          </span>
        </div>
        <!-- Password Strength Meter -->
        <div id="passwordStrengthWrap" class="mt-2 d-none">
          <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
            <div id="passwordStrengthBar" style="height:100%;width:0%;border-radius:2px;transition:all 0.3s ease;"></div>
          </div>
          <div id="passwordStrengthText" class="form-hint mt-1"></div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group-custom">
        <label class="form-label-custom" for="registerConfirmPassword">Confirm Password</label>
        <div style="position:relative;">
          <input
            type="password"
            id="registerConfirmPassword"
            name="confirmPassword"
            class="form-control-custom"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
            style="padding-right:42px;"
          />
          <span id="toggleConfirmPwd" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);cursor:pointer;font-size:15px;">
            <i class="bi bi-eye"></i>
          </span>
        </div>
        <div class="form-hint" id="passwordMatchHint"></div>
      </div>

      <!-- Terms & Conditions -->
      <div class="d-flex align-items-start gap-2 mb-4">
        <input
          type="checkbox"
          id="agreeTerms"
          name="agreeTerms"
          required
          style="width:16px;height:16px;accent-color:var(--teal);cursor:pointer;margin-top:3px;flex-shrink:0;"
        />
        <label for="agreeTerms" style="font-size:0.85rem;color:var(--text-secondary);cursor:pointer;margin:0;line-height:1.5;">
          I agree to the <a href="#" style="color:var(--teal);">Terms of Service</a> and
          <a href="#" style="color:var(--teal);">Privacy Policy</a>. My data may be used to improve the platform experience.
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" id="registerBtn" class="btn-teal w-100" style="padding:13px;font-size:0.95rem;">
        <span id="registerBtnText"><i class="bi bi-person-plus me-2"></i>Create Account</span>
        <span id="registerBtnLoading" class="d-none">
          <span class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span>Creating account...
        </span>
      </button>

    </form>

    <!-- Footer -->
    <p class="auth-footer-text" style="margin-top:20px;text-align:center;font-size:0.88rem;color:var(--text-muted);">
      Already have an account? <a href="login.html" style="color:var(--teal);">Log in →</a>
    </p>

  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Floating Theme Toggle FAB -->
<button class="theme-toggle-fab" id="themeFab" aria-label="Toggle theme">
  <i class="bi bi-moon-stars-fill"></i>
</button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
  // ── Theme Toggle ──────────────────────────────────────────
  (function () {
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('ppt-theme', theme);
      document.querySelectorAll('.theme-toggle, .theme-toggle-fab').forEach(function (btn) {
        var i = btn.querySelector('i');
        if (i) i.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-stars-fill';
        btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      });
    }
    var saved = localStorage.getItem('ppt-theme') || 'dark';
    document.addEventListener('DOMContentLoaded', function () {
      applyTheme(saved);
      document.querySelectorAll('.theme-toggle, .theme-toggle-fab').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme') || 'dark';
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });
      });
    });
  })();

  // ── Password Visibility Toggles ───────────────────────────
  document.getElementById('toggleRegPwd').addEventListener('click', function () {
    var inp = document.getElementById('registerPassword');
    var icon = this.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  document.getElementById('toggleConfirmPwd').addEventListener('click', function () {
    var inp = document.getElementById('registerConfirmPassword');
    var icon = this.querySelector('i');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  });

  // ── Password Strength Meter ───────────────────────────────
  document.getElementById('registerPassword').addEventListener('input', function () {
    var val = this.value;
    var wrap = document.getElementById('passwordStrengthWrap');
    var bar  = document.getElementById('passwordStrengthBar');
    var text = document.getElementById('passwordStrengthText');

    if (!val) { wrap.classList.add('d-none'); return; }
    wrap.classList.remove('d-none');

    var score = 0;
    if (val.length >= 8)         score++;
    if (/[A-Z]/.test(val))       score++;
    if (/[0-9]/.test(val))       score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    var levels = [
      { w: '25%',  color: '#ff4d6d', label: 'Too weak' },
      { w: '50%',  color: '#ffb830', label: 'Fair' },
      { w: '75%',  color: '#a78bfa', label: 'Good' },
      { w: '100%', color: '#00d2af', label: 'Strong ✓' },
    ];
    var lvl = levels[score - 1] || levels[0];
    bar.style.width      = lvl.w;
    bar.style.background = lvl.color;
    text.textContent     = lvl.label;
    text.style.color     = lvl.color;
  });

  // ── Password Match Hint ───────────────────────────────────
  document.getElementById('registerConfirmPassword').addEventListener('input', function () {
    var pwd  = document.getElementById('registerPassword').value;
    var conf = this.value;
    var hint = document.getElementById('passwordMatchHint');
    if (!conf) { hint.textContent = ''; return; }
    if (pwd === conf) {
      hint.textContent = 'Passwords match ✓';
      hint.style.color = '#00d2af';
    } else {
      hint.textContent = 'Passwords do not match';
      hint.style.color = '#ff4d6d';
    }
  });

  // ── Register Form Submit ──────────────────────────────────
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    var name     = document.getElementById('registerName').value.trim();
    var email    = document.getElementById('registerEmail').value.trim();
    var password = document.getElementById('registerPassword').value;
    var confirm  = document.getElementById('registerConfirmPassword').value;
    var agreed   = document.getElementById('agreeTerms').checked;

    var alertEl  = document.getElementById('registerAlert');
    var alertMsg = document.getElementById('registerAlertMsg');

    // Hide previous alerts
    alertEl.classList.add('d-none');

    // Validation
    if (!name || !email || !password || !confirm) {
      alertMsg.textContent = 'Please fill in all fields.';
      alertEl.classList.remove('d-none');
      return;
    }
    if (!agreed) {
      alertMsg.textContent = 'Please agree to the Terms of Service.';
      alertEl.classList.remove('d-none');
      return;
    }
    if (password !== confirm) {
      alertMsg.textContent = 'Passwords do not match.';
      alertEl.classList.remove('d-none');
      return;
    }
    if (password.length < 6) {
      alertMsg.textContent = 'Password must be at least 6 characters.';
      alertEl.classList.remove('d-none');
      return;
    }

    // Show loading state
    document.getElementById('registerBtnText').classList.add('d-none');
    document.getElementById('registerBtnLoading').classList.remove('d-none');
    document.getElementById('registerBtn').disabled = true;

    try {
      await API.register(name, email, password);
      document.getElementById('registerSuccess').classList.remove('d-none');
      setTimeout(function () { location.href = 'explore.html'; }, 1500);
    } catch (err) {
      alertMsg.textContent = err.message || 'Registration failed. Please try again.';
      alertEl.classList.remove('d-none');
      // Reset button
      document.getElementById('registerBtnText').classList.remove('d-none');
      document.getElementById('registerBtnLoading').classList.add('d-none');
      document.getElementById('registerBtn').disabled = false;
    }
  });
</script>

</body>
</html>
